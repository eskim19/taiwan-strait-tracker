name: collect

on:
  schedule:
    # 3시간마다. 매시로 잡았을 때 실측하니 시간 슬롯 318개 중 244개(77%)가
    # 신규 기사 0건이었고(도착률 시간당 0.45건), 국방부는 하루 1회 발표한다.
    # 최대 지연 3시간은 '사건 단위 집계'라는 성격을 바꾸지 않으면서
    # Actions 분과 커밋 수를 1/3로 줄인다.
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt -c requirements.lock.txt

      # 게이트는 네트워크를 안 타고 7초면 끝난다. 실패해도 수집은 계속한다 —
      # 데이터 수집 중단이 클러스터링 품질 저하보다 회복 불가능하기 때문이다.
      # 피드는 지나간 시간을 돌려주지 않는다.
      #
      # `shell: bash` 가 필수다. GitHub 의 run 기본 셸은 `bash -e {0}` 인데
      # pipefail 이 꺼져 있어서 `python -m ... | tee` 의 종료코드가 tee 의
      # 것(항상 0)이 된다. 그래서 continue-on-error 가 발동할 일 자체가 없었고
      # 게이트는 깨져도 언제나 초록이었다 — 신호가 0이었다. 하필 selfcheck 는
      # 국방부 시계열이 41% 사라진 걸 잡으라고 만든 검사다.
      #
      # 이 스텝은 경고만 낸다. 실제로 잡을 빨갛게 만드는(=메일이 오는) 것은
      # 커밋 뒤의 '배포 후 검증' 스텝이다.
      - name: 회귀 게이트(비차단)
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          failed=""
          { echo "## 회귀 게이트"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python -m collector.metrics   2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || failed="$failed 클러스터링"
          python -m collector.selfcheck 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || failed="$failed 사실성"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then
            echo "> ⚠️ 게이트 실패:$failed — 수집은 계속 진행한다" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=회귀 게이트 실패::${failed# } — 수집은 계속 진행한다"
            exit 1
          fi

      - name: 수집 실행
        id: build
        run: python -m collector.build

      # 빌드가 실패해도 커밋한다.
      #
      # [5/5] 국방부 스크래핑은 RSS 와 완전히 독립인데, '모든 피드 수집 실패'
      # 종료코드 때문에 아래 두 스텝이 통째로 건너뛰어져 방금 긁은 국방부
      # 하루치가 러너와 함께 사라졌다(러너는 매 실행 새로 뜬다). 목록은 최신
      # 1쪽만 긁으므로 그 하루는 돌아오지 않는다.
      #
      # 안전한 이유 둘: ① write_json 은 임시파일+os.replace 라 반쯤 쓰인 파일이
      # 남지 않는다. ② 낡은 events.json 을 새 타임스탬프로 재게시하는 문제
      # (원래 이 종료코드의 목적)는 write_json_if_changed 가 구조적으로 없앴다 —
      # 내용이 같으면 파일을 아예 다시 쓰지 않아 재게시할 diff 자체가 없다.
      # 잡 전체는 여전히 빨갛게 끝난다(= 알림이 온다).
      - name: 커밋 메시지 생성
        id: msg
        if: ${{ !cancelled() }}
        run: |
          python - >> "$GITHUB_ENV" <<'PY'
          import json, pathlib
          meta = json.loads(pathlib.Path("docs/data/build_meta.json").read_text(encoding="utf-8"))
          grades = meta.get("grades", {})
          parts = " ".join(f"{g}{grades[g]}" for g in ("A", "B", "C", "D") if grades.get(g))
          failed = [f["name"] for f in meta.get("feeds", []) if f.get("status") == "error"]
          tail = f" / 피드실패 {len(failed)}" if failed else ""
          print(f"COMMIT_MSG=data: 사건 {meta.get('n_events', 0)}건 ({parts}){tail}")
          PY

      - name: 변경분 커밋
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          # 빌드가 메시지 생성 전에 죽으면 COMMIT_MSG 가 비고 git 이 거부한다
          git commit -m "${COMMIT_MSG:-data: 자동 수집(메시지 생성 실패)}"
          # 원격이 앞서 있을 수 있으므로 rebase 후 푸시
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
