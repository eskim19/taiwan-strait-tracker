name: collect

on:
  schedule:
    # 3시간마다. 매시로 잡았을 때 실측하니 시간 슬롯 318개 중 244개(77%)가
    # 신규 기사 0건이었고(도착률 시간당 0.45건), 국방부는 하루 1회 발표한다.
    # 최대 지연 3시간은 '사건 단위 집계'라는 성격을 바꾸지 않으면서
    # Actions 분과 커밋 수를 1/3로 줄인다.
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 게이트는 네트워크를 안 타고 7초면 끝난다. 실패해도 수집은 계속한다 —
      # 데이터 수집 중단이 클러스터링 품질 저하보다 회복 불가능하기 때문이다.
      # 피드는 지나간 시간을 돌려주지 않는다.
      - name: 회귀 게이트(비차단)
        continue-on-error: true
        run: |
          python -m collector.metrics | tee -a "$GITHUB_STEP_SUMMARY"
          python -m collector.selfcheck | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 수집 실행
        run: python -m collector.build

      - name: 커밋 메시지 생성
        id: msg
        run: |
          python - >> "$GITHUB_ENV" <<'PY'
          import json, pathlib
          meta = json.loads(pathlib.Path("docs/data/build_meta.json").read_text(encoding="utf-8"))
          grades = meta.get("grades", {})
          parts = " ".join(f"{g}{grades[g]}" for g in ("A", "B", "C", "D") if grades.get(g))
          failed = [f["name"] for f in meta.get("feeds", []) if f.get("status") == "error"]
          tail = f" / 피드실패 {len(failed)}" if failed else ""
          print(f"COMMIT_MSG=data: 사건 {meta.get('n_events', 0)}건 ({parts}){tail}")
          PY

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "$COMMIT_MSG"
          # 원격이 앞서 있을 수 있으므로 rebase 후 푸시
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
